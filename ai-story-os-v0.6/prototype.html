<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI STORY OS Prototype</title><style>body{margin:0;background:#f5f5f3;font-family:system-ui;color:#171717}.app{max-width:620px;margin:auto;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center}.card{background:white;border:1px solid #e7e7e4;border-radius:20px;padding:20px;margin:14px 0}.small{font-size:12px;color:#777}.big{font-size:28px;font-weight:800}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.m{background:#fafafa;padding:12px;border-radius:14px}.m b{display:block;font-size:20px}.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.choice{padding:15px;border:1px solid #ddd;border-radius:15px;background:white;text-align:left}.choice.sel{outline:2px solid #111}.btn{width:100%;padding:15px;border:0;border-radius:14px;background:#181818;color:white;font-weight:800;margin-top:12px}.nav{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(590px,calc(100% - 24px));background:#fff;border:1px solid #ddd;border-radius:18px;display:grid;grid-template-columns:repeat(3,1fr);padding:6px}.nav button{border:0;background:transparent;padding:12px}.screen{display:none}.screen.on{display:block}@media(max-width:500px){.choices{grid-template-columns:1fr}}</style><body><div class="app"><div class="top"><b>AI STORY</b><span>EP 009</span></div><section id="today" class="screen on"><div class="card"><div class="small">YESTERDAY</div><div class="big">◎ 強い</div><div class="metrics"><div class="m"><b>18,421</b><span class="small">再生</span></div><div class="m"><b>14.2%</b><span class="small">参加率</span></div><div class="m"><b>3.8%</b><span class="small">シェア率</span></div></div></div><div class="card"><div class="small">TODAY</div><h1>次の展開を選ぶ</h1><p>前回：ドアの外から、自分の声が聞こえた。</p><div class="choices"><button class="choice" onclick="pick(this,'A')"><b>A</b><br>ドアを開ける<br><span class="small">AI 91</span></button><button class="choice" onclick="pick(this,'B')"><b>B</b><br>警察に電話する<br><span class="small">AI 76</span></button><button class="choice" onclick="pick(this,'C')"><b>C</b><br>窓から逃げる<br><span class="small">AI 83</span></button></div><button id="adopt" class="btn" onclick="go('review')">1つ選んでください</button></div></section><section id="review" class="screen"><div class="card"><div class="small">READY</div><h1>投稿確認</h1><div style="aspect-ratio:9/16;max-width:260px;margin:12px auto;background:linear-gradient(145deg,#222,#555);border-radius:18px;color:#fff;display:grid;place-items:center;text-align:center">VIDEO<br>PREVIEW</div><p><b>ドアを開けた。誰もいなかった。</b></p><p>ただ、床にスマホが落ちていた。画面には私の写真。</p><p><b>次どうする？</b><br>A スマホを見る<br>B 触らず逃げる</p><button class="btn" onclick="go('results')">公開する</button></div></section><section id="results" class="screen"><div class="card"><div class="small">RESULT</div><div class="big">◎ 強い</div><div class="metrics"><div class="m"><b>18,421</b><span class="small">再生</span></div><div class="m"><b>14.2%</b><span class="small">参加率</span></div><div class="m"><b>3.8%</b><span class="small">シェア率</span></div></div></div><div class="card"><h3>AIの判断</h3><p><b>良かった</b><br>「自分自身から電話」という異常性</p><p><b>改善</b><br>導入を1秒短くする</p><p><b>次回</b><br>不気味さを維持</p></div></section></div><div class="nav"><button onclick="go('today')">今日</button><button onclick="go('review')">投稿</button><button onclick="go('results')">結果</button></div><script>let selected='';function pick(el,v){selected=v;document.querySelectorAll('.choice').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');document.getElementById('adopt').textContent=v+'を採用'}function go(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on')}</script></body></html>
